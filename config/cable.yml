# El adaptador async solo funciona dentro del mismo proceso: en desarrollo, las difusiones hechas
# desde `bin/rails console` no llegan al navegador.
development:
  adapter: async

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  writer_batch_size: 4
  writer_batch_delay: 0.001.seconds
