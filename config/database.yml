# PostgreSQL 14+ (CI y producción usan PostgreSQL 16).
#
# En desarrollo y pruebas se usan las variables estándar de libpq (PGHOST, PGPORT, PGUSER,
# PGPASSWORD) o DATABASE_URL, que Rails combina con los valores de este archivo. Ejemplo:
#
#   DATABASE_URL="postgres://postgres:postgres@localhost:5432" bin/rails db:prepare
#
# Las contraseñas nunca se escriben aquí: se leen del entorno.
default: &default
  adapter: postgresql
  encoding: unicode
  # Conexiones por proceso; debe ser al menos el número de hilos de Puma o de Solid Queue.
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: faro_cobranza_development

# La base de pruebas se borra y se recrea al correr la suite: nunca la apuntes a otra base.
test:
  <<: *default
  database: faro_cobranza_test

# Producción: una base principal y tres de soporte (Solid Cache, Solid Queue y Solid Cable) en el
# mismo servidor PostgreSQL. Ver config/deploy.yml y docs/deployment.md.
production:
  primary: &primary_production
    <<: *default
    database: faro_cobranza_production
    host: <%= ENV.fetch("DB_HOST", "localhost") %>
    username: faro_cobranza
    password: <%= ENV["FARO_COBRANZA_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: faro_cobranza_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: faro_cobranza_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: faro_cobranza_production_cable
    migrations_paths: db/cable_migrate
