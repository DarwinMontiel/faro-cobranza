# Despliegue con Kamal 2 (contenedores Docker en un servidor Linux con TLS automático).
# Guía completa: docs/deployment.md
#
#   kamal setup      # primera vez: instala Docker, kamal-proxy, PostgreSQL y la app
#   kamal deploy     # despliegues siguientes (sin interrumpir el servicio)
#   kamal app logs -f

service: faro_cobranza
image: darwinmontiel/faro-cobranza

servers:
  web:
    - 203.0.113.10          # IP de documentación (RFC 5737): reemplazar por la del servidor
  job:
    hosts:
      - 203.0.113.10
    cmd: bin/jobs           # Solid Queue en un contenedor dedicado

proxy:
  ssl: true                 # certificado Let's Encrypt automático
  host: faro.example.com    # dominio de la app (debe coincidir con APP_HOST)
  healthcheck:
    path: /up

registry:
  server: ghcr.io
  username: DarwinMontiel
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - FARO_COBRANZA_DATABASE_PASSWORD
    - SMTP_USERNAME
    - SMTP_PASSWORD
  clear:
    DB_HOST: faro_cobranza-db
    APP_HOST: faro.example.com               # host de los enlaces de los correos
    MAILER_FROM: "Faro Cobranza <no-responder@faro.example.com>"
    SMTP_ADDRESS: smtp.example.com           # vacío = no se envían correos
    SMTP_PORT: 587
    RAILS_LOG_TO_STDOUT: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "faro_cobranza_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgres:16
    host: 203.0.113.10
    port: "127.0.0.1:5432:5432"   # solo accesible desde el propio servidor
    env:
      clear:
        POSTGRES_USER: faro_cobranza
        POSTGRES_DB: faro_cobranza_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
