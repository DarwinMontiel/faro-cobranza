# Tareas programadas de Solid Queue (las ejecuta bin/jobs).
# Documentación: https://github.com/rails/solid_queue#recurring-tasks

production:
  # Cierre diario de cartera: días de mora y acuerdos incumplidos (1:00 a. m. hora de Colombia).
  refresh_delinquency:
    class: RefreshDelinquencyJob
    queue: default
    schedule: "0 1 * * * America/Bogota"

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
