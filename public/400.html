<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Solicitud incorrecta · Faro Cobranza</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f4f7f8; --surface: #fff; --text: #0f1f2e; --muted: #5b6b78; --accent: #0f766e; --border: #e2e8ec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b141c; --surface: #111d27; --text: #e6edf2; --muted: #8aa0b0; --accent: #5eead4; --border: #1f2f3c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); }
    main { max-width: 440px; width: 100%; padding: 32px; border-radius: 14px; background: var(--surface);
           border: 1px solid var(--border); box-shadow: 0 6px 18px rgb(15 31 46 / 6%); }
    img { display: block; width: 56px; height: 56px; margin-bottom: 20px; }
    .code { margin: 0; font: 600 13px/1 ui-monospace, Consolas, monospace; letter-spacing: .08em; color: var(--accent); }
    h1 { margin: 8px 0 12px; font-size: 22px; line-height: 1.3; }
    p { margin: 0 0 20px; color: var(--muted); }
    a { color: var(--accent); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <img src="/icon.svg" alt="">
    <p class="code">ERROR 400</p>
    <h1>Solicitud incorrecta</h1>
    <p>No pudimos entender la solicitud. Revisa el enlace o vuelve a intentarlo desde el tablero.</p>
    <a href="/">← Volver al tablero</a>
  </main>
</body>
</html>
